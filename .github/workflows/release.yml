name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  derive-version:
    name: Derive version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: derive-version
    uses: ./.github/workflows/_publish-image.yml
    with:
      version: ${{ needs.derive-version.outputs.version }}
      tag-latest: true
    secrets: inherit
